<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyKOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <img src="logo.png" alt="MyKOG">
        <span>MyKOG</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Accueil</span>
        </a>
        <a class="nav-item" data-page="browse">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span>Découvrir</span>
        </a>
        <a class="nav-item" data-page="live">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <span>Live</span>
        </a>
        <a class="nav-item" data-page="library">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <span>Bibliothèque</span>
        </a>
        <a class="nav-item" data-page="calendar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Calendrier</span>
        </a>
        <a class="nav-item" data-page="resumes">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Résumés</span>
        </a>
        <a class="nav-item" data-page="profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
          <span>Profil</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-theme-toggle" onclick="App.toggleTheme()" title="Mode sombre/clair">
          <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </div>
        <span class="version">v1.0.0</span>
      </div>
    </aside>

    <main id="main-content">
      <div id="page-login" class="page"></div>
      <div id="page-home" class="page"></div>
      <div id="page-browse" class="page"></div>
      <div id="page-live" class="page"></div>
      <div id="page-library" class="page"></div>
      <div id="page-calendar" class="page"></div>
      <div id="page-resumes" class="page"></div>
      <div id="page-profile" class="page"></div>
    </main>

    <div id="mini-player" class="hidden">
      <div class="player-info">
        <div class="player-artwork" id="player-artwork">
          <img id="player-artwork-img" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;">
          <div id="player-artwork-fallback">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
        </div>
        <div class="player-text">
          <span class="player-title" id="player-title">Aucune lecture</span>
          <span class="player-speaker" id="player-speaker"></span>
        </div>
      </div>
      <div class="player-controls">
        <button id="player-prev" class="player-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z"/></svg>
        </button>
        <button id="player-play" class="player-btn play-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="player-next" class="player-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l10 8-10 8V4zm11 0v16h2V4h-2z"/></svg>
        </button>
      </div>
      <div class="player-progress">
        <span class="current-time" id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="total-time" id="total-time">0:00</span>
      </div>
    </div>
  </div>

  <button id="retry-btn" class="retry-btn" onclick="Store.retryConnection()" title="Reconnecter">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
    <span>Reconnecter</span>
  </button>

  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <img src="assets/kog.png" alt="MyKOG" class="loading-logo">
      <h1 class="loading-title">MyKOG</h1>
      <div class="loading-texts">
        <p class="loading-text active">Conduire le peuple<br>dans sa véritable repentance</p>
        <p class="loading-text">Révéler les mystères<br>du royaume</p>
        <p class="loading-text">Accomplir sa destinée</p>
      </div>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <script src="node_modules/livekit-client/dist/livekit-client.umd.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/onboarding.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/browse.js"></script>
  <script src="js/pages/live.js"></script>
  <script src="js/pages/library.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/resumes.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
